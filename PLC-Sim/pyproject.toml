[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unilab-plc-sim"
version = "0.2.6"
description = "ICCAS OPC UA protocol, equipment, process timing, and HMI simulator"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "opcua==0.98.13",
  "PyYAML>=6.0,<7",
  "fastapi>=0.110,<1",
  "uvicorn>=0.23,<1",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "build>=1.2,<2",
  "setuptools>=68",
  "wheel>=0.42",
]

[project.scripts]
plc-sim = "plc_sim.cli:main"

[tool.setuptools]
packages = ["plc_sim", "plc_sim.gui"]
package-dir = {plc_sim = ".", "plc_sim.gui" = "gui"}
include-package-data = false

[tool.setuptools.package-data]
plc_sim = [
  "config/*.yaml",
  "data/*.csv",
]
"plc_sim.gui" = ["static/*.html", "static/*.css", "static/*.js", "static/*.png", "static/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
